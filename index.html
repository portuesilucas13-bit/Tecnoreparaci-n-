<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>TechStock Reparaciones</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#111c33;border-bottom:1px solid #263653}
h1{margin:0;font-size:24px}
h1 span{color:#22d3ee}
main{max-width:800px;margin:auto;padding:16px}
.panel{background:#111c33;border:1px solid #263653;border-radius:15px;padding:16px;margin-bottom:16px}
input,select,textarea{width:100%;padding:12px;margin:5px 0 12px;border-radius:8px;border:1px solid #31415e;background:#0b1220;color:white;font-size:16px}
label{display:block;font-size:14px;color:#cbd5e1}
button{border:0;border-radius:9px;padding:12px;background:#1769ff;color:white;font-weight:bold;font-size:15px;margin:4px 0;cursor:pointer}
button.sec{background:#334155}
button.green{background:#168653}
button.red{background:#a51d35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid #334155;border-radius:12px;padding:13px;margin:10px 0;background:#0f1a2d}
.small{color:#aabbd2;font-size:13px}
.status{color:#fcd34d;font-weight:bold}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>TechStock <span>Reparaciones</span></h1>
<div class="small">Gestión de órdenes de reparación</div>
</header>
<main>
<div class="panel">
<h2>📋 Nuevo ingreso</h2>
<form id="form">
<label>Nombre del cliente *</label>
<input id="cliente" required>
<label>WhatsApp del cliente *</label>
<input id="telefono" type="tel" required placeholder="Código de país y número">
<div class="grid">
<div><label>Marca *</label><input id="marca" required placeholder="Samsung, Motorola..."></div>
<div><label>Modelo *</label><input id="modelo" required placeholder="A32, G54..."></div>
</div>
<label>IMEI o número de serie (opcional)</label>
<input id="imei">
<label>Falla declarada por el cliente *</label>
<textarea id="falla" required rows="2"></textarea>
<label>Estado físico al recibirlo</label>
<textarea id="estadoFisico" rows="2" placeholder="Golpes, rayones, pantalla rota..."></textarea>
<label>Accesorios recibidos</label>
<input id="accesorios" placeholder="Ninguno, funda, cargador...">
<label>Trabajo o diagnóstico inicial</label>
<textarea id="diagnostico" rows="2"></textarea>
<div class="grid">
<div><label>Presupuesto estimado ($)</label><input id="presupuesto" type="number" min="0"></div>
<div><label>Seña recibida ($)</label><input id="sena" type="number" min="0" value="0"></div>
</div>
<label>Estado de la reparación</label>
<select id="estado">
<option>Recibido</option>
<option>En revisión</option>
<option>Esperando repuesto</option>
<option>En reparación</option>
<option>Reparado</option>
<option>Entregado</option>
</select>
<label>Observaciones</label>
<textarea id="observaciones" rows="2"></textarea>
<button type="submit">Guardar ingreso</button>
</form>
</div>
<div class="panel">
<h2>🔎 Reparaciones registradas</h2>
<input id="buscar" placeholder="Buscar por orden, cliente o modelo..." oninput="mostrar()">
<div id="lista"></div>
</div>
</main>
<script>
let reparaciones=[];
try{reparaciones=JSON.parse(localStorage.getItem("techstock_reparaciones")||"[]")}catch(e){reparaciones=[]}
let siguiente=Math.max(1,...reparaciones.map(r=>Number(r.id)||0))+0;
function guardar(){localStorage.setItem("techstock_reparaciones",JSON.stringify(reparaciones))}
document.getElementById("form").addEventListener("submit",function(e){
e.preventDefault();
let r={
id:siguiente++,
fecha:new Date().toLocaleDateString("es-AR"),
cliente:cliente.value.trim(),
telefono:telefono.value.trim(),
marca:marca.value.trim(),
modelo:modelo.value.trim(),
imei:imei.value.trim(),
falla:falla.value.trim(),
estadoFisico:estadoFisico.value.trim(),
accesorios:accesorios.value.trim(),
diagnostico:diagnostico.value.trim(),
presupuesto:Number(presupuesto.value)||0,
sena:Number(sena.value)||0,
estado:estado.value,
observaciones:observaciones.value.trim()
};
reparaciones.unshift(r);
guardar();
this.reset();
sena.value=0;
mostrar();
alert("Ingreso guardado. Orden REP-"+String(r.id).padStart(4,"0"));
});
function mostrar(){
let q=(document.getElementById("buscar").value||"").toLowerCase();
let lista=document.getElementById("lista");
let filtradas=reparaciones.filter(r=>(r.cliente+" "+r.marca+" "+r.modelo+" "+r.id).toLowerCase().includes(q));
if(!filtradas.length){lista.innerHTML='<p class="small">Todavía no hay reparaciones registradas.</p>';return}
lista.innerHTML=filtradas.map(r=>`
<div class="item">
<strong>Orden REP-${String(r.id).padStart(4,"0")}</strong>
<p>👤 ${esc(r.cliente)} · 📱 ${esc(r.marca)} ${esc(r.modelo)}</p>
<p>Falla: ${esc(r.falla)}</p>
<p class="status">${esc(r.estado)}</p>
<p class="small">Ingreso: ${esc(r.fecha)} · Presupuesto: $${r.presupuesto}</p>
<button onclick="whatsapp(${r.id})">Preparar WhatsApp</button>
<button class="sec" onclick="pdf(${r.id})">Imprimir / Guardar PDF</button>
<button class="sec" onclick="cambiarEstado(${r.id})">Cambiar estado</button>
</div>`).join("");
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function obtener(id){return reparaciones.find(r=>r.id===id)}
function mensaje(r){return `COMPROBANTE DE INGRESO - TECHSTOCK REPARACIONES\nOrden: REP-${String(r.id).padStart(4,"0")}\nCliente: ${r.cliente}\nEquipo: ${r.marca} ${r.modelo}\nFalla declarada: ${r.falla}\nEstado: ${r.estado}\nPresupuesto estimado: $${r.presupuesto}\nSeña: $${r.sena}\nSaldo estimado: $${Math.max(0,r.presupuesto-r.sena)}\nIngreso: ${r.fecha}\nConservá este mensaje para consultar por tu reparación.`}
function whatsapp(id){let r=obtener(id);if(!r)return;let tel=r.telefono.replace(/\D/g,"");let url="https://wa.me/"+tel+"?text="+encodeURIComponent(mensaje(r));window.open(url,"_blank")}
function pdf(id){let r=obtener(id);if(!r)return;let w=window.open("","_blank");if(!w){alert("Permití las ventanas emergentes para imprimir el comprobante.");return}w.document.write("<html><head><title>Comprobante</title><style>body{font-family:Arial;padding:25px;line-height:1.5}h1{color:#123}hr{margin:20px 0}</style></head><body><h1>TechStock Reparaciones</h1><h2>Comprobante de ingreso REP-"+String(r.id).padStart(4,"0")+"</h2><hr>"+mensaje(r).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\n/g,"<br>")+"<hr><p>Firma del cliente: __________________</p><p>Firma del técnico: __________________</p><p>Este comprobante registra el ingreso del equipo y no constituye por sí solo una garantía del resultado de la reparación.</p><script>window.onload=()=>window.print()<\/script></body></html>");w.document.close()}
function cambiarEstado(id){let r=obtener(id);if(!r)return;let nuevo=prompt("Nuevo estado:\nRecibido\nEn revisión\nEsperando repuesto\nEn reparación\nReparado\nEntregado",r.estado);if(nuevo){r.estado=nuevo;guardar();mostrar()}}
mostrar();
</script>
</body>
</html>
